name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend Testing Suite (Python + Pytest + Postgres + Redis)
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: flash_sale_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/flash_sale_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-testing-secret-key-do-not-use-in-production
      JWT_SECRET_KEY: ci-testing-jwt-secret-key

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Execute Database Seed & Migration Check
        run: |
          cd backend
          # Run database initialization scripts if applicable
          python -c "from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all()"

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest tests/ -v --color=yes

  # ---------------------------------------------------------------------------
  # Job 2: Frontend Type Check & Build Verification (React + TypeScript + Vite)
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compiler Check (Strict No Emit)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Verify Production Vite Build
        run: |
          cd frontend
          npm run build